<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b63"><title>Hameeds Bistro</title>
<link rel="icon" href="images/logo.png">
<style>
:root{--blue:#0f3b63;--blue2:#174f82;--gold:#d7a52a;--ink:#17202a;--muted:#667085;--card:#fff;--line:#dfe5ec;--shadow:0 12px 35px rgba(15,59,99,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f5f8fb}body:before{content:"";position:fixed;inset:0;z-index:-2;background:#f5f8fb url('images/logo.png') repeat;background-size:1cm 1cm;opacity:.5}body:after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(255,255,255,.86);pointer-events:none}.app{max-width:1280px;margin:auto;padding:12px}.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:10px 14px}.headrow{display:flex;align-items:center;gap:12px}.brandlogo{width:54px;height:54px;object-fit:contain;border-radius:12px}.brand{font-weight:900;color:var(--blue);font-size:clamp(18px,3vw,28px);line-height:1.05}.sub{font-size:11px;color:var(--muted);margin-top:3px}.head-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.iconbtn,.langbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-weight:800;cursor:pointer}.iconbtn:hover,.langbtn:hover{border-color:var(--blue)}.home-panel{margin-top:14px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px}.home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mainbtn{border:0;border-radius:18px;padding:18px 12px;color:#fff;background:var(--blue);font-weight:900;font-size:15px;cursor:pointer;min-height:76px;box-shadow:0 8px 20px rgba(15,59,99,.18)}.mainbtn:nth-child(2){background:var(--blue2)}.mainbtn:nth-child(3){background:#b87800}.mainbtn:nth-child(4){background:#344054}.slider{margin-top:16px;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);position:relative;min-height:220px}.slide{display:none;grid-template-columns:1fr 1fr;min-height:220px}.slide.active{display:grid}.slide img{width:100%;height:260px;object-fit:cover;cursor:zoom-in}.slide-info{padding:20px;display:flex;flex-direction:column;justify-content:center}.slide-info h2{margin:0 0 7px;color:var(--blue)}.slide-info p{margin:0;color:var(--muted);line-height:1.5}.dots{position:absolute;bottom:9px;left:0;right:0;text-align:center}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c5cbd3;margin:0 3px}.dot.active{background:var(--blue)}.toolbar{margin-top:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.select,.search{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-weight:700}.search{flex:1;min-width:180px}.categorybar{display:flex;gap:8px;overflow:auto;padding:10px 0;scrollbar-width:thin}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.cat.active{background:var(--blue);color:#fff;border-color:var(--blue)}.content{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-top:5px}.side{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);height:max-content;position:sticky;top:90px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}.side button.active{background:#e8f1f9;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 7px 18px rgba(15,59,99,.07)}.photo{height:145px;width:100%;object-fit:cover;background:#eef2f6;display:block;cursor:zoom-in}.cardbody{padding:11px}.itemname{font-weight:900;font-size:16px;color:var(--blue);cursor:pointer}.original{font-size:11px;color:#777;margin-top:3px}.desc{font-size:12px;line-height:1.45;color:#59636f;margin-top:7px;cursor:pointer;min-height:35px}.price{font-weight:900;color:#a05d00;margin-top:8px}.add{width:100%;margin-top:9px;border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px;font-weight:900;cursor:pointer}.out{font-size:12px;color:#b42318;font-weight:900;margin-top:8px}.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:40;display:none;background:var(--blue);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 12px 35px rgba(0,0,0,.22);width:min(94%,520px);align-items:center;gap:10px}.cartbar.show{display:flex}.cartbar .cartcount{font-weight:900}.cartbar button{margin-left:auto;border:0;background:#fff;color:var(--blue);border-radius:10px;padding:9px 13px;font-weight:900}.footer{text-align:center;padding:28px 8px 80px;color:#667085;font-size:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(5,20,35,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.modalbox{background:#fff;border-radius:20px;max-width:850px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.35)}.modalhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modalhead h3{margin:0;font-size:18px;color:var(--blue)}.close{margin-left:auto;border:0;background:#eef2f6;border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}.modalbody{padding:16px}.image-modal{background:rgba(0,0,0,.92)}.image-stage{width:100%;height:80vh;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:grab}.image-stage img{max-width:95%;max-height:95%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}.zoomtools{text-align:center;padding:8px}.zoomtools button{border:0;background:#fff;border-radius:9px;padding:8px 12px;margin:0 3px;font-weight:900}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:5px;align-items:center}.qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-weight:900}.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px}.primary{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:11px;font-weight:900;cursor:pointer}.danger{border:0;background:#fee4e2;color:#b42318;padding:10px;border-radius:11px;font-weight:900}.notice{padding:10px 12px;border-radius:11px;background:#f0f6fb;color:var(--blue);font-size:13px;margin-bottom:10px}.history-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}.history-items{font-size:12px;color:#667085;margin-top:6px}.langgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.langoption{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer;text-align:left}.langoption.active{border-color:var(--blue);background:#edf5fb}.spinner{width:20px;height:20px;border:3px solid #dce5ed;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.home-buttons{grid-template-columns:repeat(2,1fr)}.content{display:block}.side{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slide{grid-template-columns:1fr}.slide img{height:190px}.slide-info{padding:12px}.checkout-grid{grid-template-columns:1fr}.brandlogo{width:45px;height:45px}.head-actions{gap:4px}.iconbtn{padding:8px}.card .photo{height:130px}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.cardbody{padding:9px}.itemname{font-size:14px}.desc{font-size:11px}.price{font-size:13px}.mainbtn{font-size:13px;padding:13px 8px}}
</style></head>
<body><div class="app">
<header class="header"><div class="headrow"><img class="brandlogo" src="images/logo.png"><div><div class="brand" id="brandName">Hameeds Bistro</div><div class="sub" id="tableLabel">Customer Menu</div></div><div class="head-actions"><button class="iconbtn" id="refreshBtn" title="Refresh database">↻ Refresh</button><button class="iconbtn" id="langBtn">🌐 Language</button><button class="iconbtn" id="cartBtn">🛒 <span id="cartTop">0</span></button></div></div></header>
<main id="appMain"></main><footer class="footer">© <span id="year"></span> Hameeds Bistro — All rights reserved.</footer></div>
<div id="cartBar" class="cartbar"><span>🛒 <span id="cartCount">0</span> items</span><span id="cartTotal">RM 0.00</span><button id="openCartBtn">View Cart</button></div>
<div id="modalRoot"></div>
<script src="customer-api-config.js"></script><script src="app.js"></script></body></html>
